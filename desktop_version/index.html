<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손글씨 숫자 입력기</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2330; --muted: #6b7280;
    --border: #d9dde3; --accent: #2563eb; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1e2229; --text: #e6e8eb; --muted: #9aa3ae;
            --border: #333a44; --accent: #4c8dff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 12px; padding: 16px; }
  #draw { background: #000; border-radius: 8px; touch-action: none;
          cursor: crosshair; width: 280px; height: 280px; display: block; }
  #preview { width: 140px; height: 140px; image-rendering: pixelated;
             background: #000; border-radius: 6px; display: block; }
  .label { font-size: .8rem; color: var(--muted); margin: 0 0 8px; }
  .digits { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0 12px; }
  button { font: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .digits button { font-size: 1.1rem; font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .stats { font-size: .85rem; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  #samples { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  #samples figure { margin: 0; text-align: center; font-size: .7rem; color: var(--muted); }
  #samples canvas { width: 42px; height: 42px; image-rendering: pixelated;
                    background: #000; border-radius: 4px; display: block; cursor: pointer; }
  .brush { display: flex; align-items: center; gap: 8px; font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>손글씨 숫자 입력기</h1>
  <p class="sub">숫자를 그린 뒤 라벨(0–9)을 누르면 MNIST 형식(28×28, 흑백)으로 저장됩니다.</p>

  <div class="row">
    <div class="card">
      <p class="label">여기에 그리세요 (마우스 / 터치)</p>
      <canvas id="draw" width="280" height="280"></canvas>
      <div class="brush">
        <label for="brush">붓 굵기</label>
        <input id="brush" type="range" min="10" max="36" value="22">
      </div>
      <div class="actions">
        <button id="clear">지우기 (Esc)</button>
        <button id="undo">되돌리기 (Ctrl+Z)</button>
      </div>
    </div>

    <div class="card" style="flex:1; min-width:240px">
      <p class="label">28×28 전처리 미리보기</p>
      <canvas id="preview" width="28" height="28"></canvas>
      <p class="label" style="margin-top:14px">라벨을 눌러 저장 (키보드 0–9)</p>
      <div class="digits" id="digits"></div>
      <div class="actions">
        <button id="exportCsv" class="primary">CSV 내보내기</button>
        <button id="exportJson">JSON 내보내기</button>
        <button id="reset">데이터 전체 삭제</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <p class="label">저장된 샘플 (클릭하면 삭제)</p>
    <div id="samples"></div>
  </div>
</main>

<script>
const draw = document.getElementById('draw');
const dctx = draw.getContext('2d');
const preview = document.getElementById('preview');
const pctx = preview.getContext('2d');
const brush = document.getElementById('brush');
const STORE_KEY = 'mnist-handwriting-samples';

let strokes = [];      // 되돌리기용 획 목록
let current = null;
let samples = load();

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(samples)); } catch {}
}

// ---------- 그리기 ----------
function pos(e) {
  const r = draw.getBoundingClientRect();
  return [(e.clientX - r.left) * draw.width / r.width,
          (e.clientY - r.top) * draw.height / r.height];
}
function redraw() {
  dctx.fillStyle = '#000';
  dctx.fillRect(0, 0, draw.width, draw.height);
  dctx.strokeStyle = '#fff';
  dctx.lineCap = dctx.lineJoin = 'round';
  for (const s of strokes) {
    dctx.lineWidth = s.w;
    dctx.beginPath();
    dctx.moveTo(...s.pts[0]);
    for (const p of s.pts) dctx.lineTo(...p);
    if (s.pts.length === 1) dctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    dctx.stroke();
  }
  updatePreview();
}
draw.addEventListener('pointerdown', e => {
  draw.setPointerCapture(e.pointerId);
  current = { w: +brush.value, pts: [pos(e)] };
  strokes.push(current);
  redraw();
});
draw.addEventListener('pointermove', e => {
  if (!current) return;
  current.pts.push(pos(e));
  redraw();
});
['pointerup', 'pointercancel'].forEach(t =>
  draw.addEventListener(t, () => { current = null; }));

// ---------- MNIST 전처리 ----------
// MNIST 방식: 글씨의 경계 상자를 20×20 안에 비율 유지로 맞춘 뒤(면적 평균 축소),
// 무게중심이 28×28 이미지의 중앙에 오도록 배치.
// 같은 알고리즘이 desktop_version/preprocess.py, web_version/preprocess.js 에도 있다.
// 하나를 바꾸면 나머지도 같이 바꾼다. 반올림은 항상 floor(v + 0.5).
const roundHalfUp = v => Math.floor(v + 0.5);

// 출력 칸 o 가 소스 구간 [o*n/m, (o+1)*n/m) 과 겹치는 길이. 0 이 아닌 것만 [i, w] 목록으로.
function axisWeights(nSrc, nOut) {
  const step = nSrc / nOut, all = [];
  for (let o = 0; o < nOut; o++) {
    const lo = o * step, hi = lo + step, list = [];
    for (let i = Math.floor(lo); i < Math.min(nSrc, Math.ceil(hi)); i++) {
      const w = Math.min(i + 1, hi) - Math.max(i, lo);
      if (w > 0) list.push([i, w]);
    }
    all.push(list);
  }
  return all;
}

// src(너비 srcW)의 (x0, y0, bw, bh) 영역을 sw×sh 로 정확한 면적 평균 축소. 가로 먼저, 세로 다음.
function areaDownscale(src, srcW, x0, y0, bw, bh, sw, sh) {
  const wx = axisWeights(bw, sw), wy = axisWeights(bh, sh);
  const rows = new Float64Array(bh * sw);
  for (let y = 0; y < bh; y++) {
    const base = (y0 + y) * srcW + x0;
    for (let ox = 0; ox < sw; ox++) {
      let s = 0;
      for (const [i, w] of wx[ox]) s += src[base + i] * w;
      rows[y * sw + ox] = s;
    }
  }
  const area = (bw / sw) * (bh / sh);
  const out = new Uint8Array(sw * sh);
  for (let oy = 0; oy < sh; oy++) {
    for (let ox = 0; ox < sw; ox++) {
      let s = 0;
      for (const [i, w] of wy[oy]) s += rows[i * sw + ox] * w;
      out[oy * sw + ox] = Math.min(255, Math.max(0, roundHalfUp(s / area)));
    }
  }
  return out;
}

function toMnist() {
  const { width: W, height: H } = draw;
  const rgba = dctx.getImageData(0, 0, W, H).data;
  const gray = new Uint8Array(W * H);
  for (let i = 0; i < gray.length; i++) gray[i] = rgba[i * 4];   // 흰 획이라 R=G=B

  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (gray[y * W + x] > 20) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return null;

  // 1단계: 긴 변이 20px 이 되도록 면적 평균 축소
  const bw = maxX - minX + 1, bh = maxY - minY + 1;
  const scale = 20 / Math.max(bw, bh);
  const sw = Math.max(1, roundHalfUp(bw * scale)), sh = Math.max(1, roundHalfUp(bh * scale));
  const small = areaDownscale(gray, W, minX, minY, bw, bh, sw, sh);

  // 2단계: 정수화된 축소 결과로 무게중심 계산
  let sum = 0, cx = 0, cy = 0;
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const v = small[y * sw + x];
    sum += v; cx += x * v; cy += y * v;
  }
  if (sum === 0) return null;
  const ox = Math.floor(14 - cx / sum), oy = Math.floor(14 - cy / sum);

  // 3단계: 28×28에 배치
  const out = new Uint8Array(28 * 28);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const tx = x + ox, ty = y + oy;
    if (tx >= 0 && tx < 28 && ty >= 0 && ty < 28)
      out[ty * 28 + tx] = small[y * sw + x];
  }
  return out;
}
function paintPixels(ctx, pixels) {
  const img = ctx.createImageData(28, 28);
  for (let i = 0; i < 784; i++) {
    const v = pixels ? pixels[i] : 0;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
function updatePreview() { paintPixels(pctx, toMnist()); }

// ---------- 저장 / 목록 ----------
function addSample(label) {
  const pixels = toMnist();
  if (!pixels) return;
  samples.push({ label, pixels: Array.from(pixels) });
  save();
  strokes = [];
  redraw();
  render();
}
function render() {
  const counts = Array(10).fill(0);
  samples.forEach(s => counts[s.label]++);
  document.getElementById('stats').innerHTML =
    `총 <b>${samples.length}</b>개 저장됨<br>` +
    counts.map((c, d) => `${d}: ${c}`).join(' · ');

  const box = document.getElementById('samples');
  box.innerHTML = '';
  samples.forEach((s, i) => {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    c.width = c.height = 28;
    paintPixels(c.getContext('2d'), s.pixels);
    c.title = `라벨 ${s.label} — 클릭하면 삭제`;
    c.onclick = () => { samples.splice(i, 1); save(); render(); };
    fig.append(c, s.label);
    box.append(fig);
  });
}

const digits = document.getElementById('digits');
for (let d = 0; d < 10; d++) {
  const b = document.createElement('button');
  b.textContent = d;
  b.onclick = () => addSample(d);
  digits.append(b);
}

// ---------- 내보내기 ----------
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}
// CSV: Kaggle mnist_train.csv 와 같은 형식 (label, pixel0 … pixel783)
document.getElementById('exportCsv').onclick = () => {
  const header = ['label', ...Array.from({ length: 784 }, (_, i) => 'pixel' + i)].join(',');
  const rows = samples.map(s => [s.label, ...s.pixels].join(','));
  download('my_mnist.csv', [header, ...rows].join('\n'), 'text/csv');
};
document.getElementById('exportJson').onclick = () =>
  download('my_mnist.json', JSON.stringify(samples), 'application/json');
document.getElementById('reset').onclick = () => {
  if (confirm('저장된 샘플을 모두 삭제할까요?')) { samples = []; save(); render(); }
};

// ---------- 버튼 / 단축키 ----------
document.getElementById('clear').onclick = () => { strokes = []; redraw(); };
document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); };
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9' && !e.ctrlKey) addSample(+e.key);
  else if (e.key === 'Escape') { strokes = []; redraw(); }
  else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { strokes.pop(); redraw(); }
});

redraw();
render();
</script>
</body>
</html>
