# main 에 push 하면 web_version/ 만 GitHub Pages 로 배포한다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 바꿔 두어야 한다.
name: Deploy web_version to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_version
      - id: deployment
        uses: actions/deploy-pages@v4
